<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="/logo.png" />
  <link rel="apple-touch-icon" href="/logo.png" />
  <title>Docu AI Search</title>
  <meta name="description" content="AI-powered local document search with semantic search and LLM integration." />
  <script>
    (function () {
      try {
        var theme = localStorage.getItem('docu-ai-theme');
        var supportDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (theme === 'dark' || (!theme && supportDark)) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (e) {}
    })();
  </script>
  <!-- Geist font family -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet" />
</head>

<body class="bg-[#fafafa] dark:bg-[#0a0a0a] text-ink dark:text-[#ededed]">
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
